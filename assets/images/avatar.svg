  <ellipse cx="159" cy="228" rx="15" ry="24" fill="#dfad82"/>
  <ellipse cx="353" cy="228" rx="15" ry="24" fill="#dfad82"/>

  <!-- 脸部 -->
  <ellipse cx="256" cy="232" rx="97" ry="116" fill="#efc49d"/>

  <!-- 头发（吴彦祖式短发型） -->
