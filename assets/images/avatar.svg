  <rect x="262" y="196" width="56" height="9" rx="4.5" fill="#16161c" transform="rotate(6 290 200)"/>

  <!-- 眼睛 -->
  <ellipse cx="224" cy="230" rx="17" ry="12" fill="#ffffff"/>
  <ellipse cx="288" cy="230" rx="17" ry="12" fill="#ffffff"/>
  <ellipse cx="225" cy="231" rx="8.5" ry="8.5" fill="#2e2825"/>
  <ellipse cx="287" cy="231" rx="8.5" ry="8.5" fill="#2e2825"/>
  <circle cx="228" cy="227" r="3.2" fill="#ffffff"/>
  <circle cx="290" cy="227" r="3.2" fill="#ffffff"/>

  <!-- 鼻子 -->
  <path d="M256 238 C250 258 253 270 256 275" stroke="#d49c74" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  <!-- 微笑 -->
  <path d="M231 292 C244 307 268 307 281 292" stroke="#b5765c" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- 下颌阴影 -->
