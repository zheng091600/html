  <path d="M159 210 C150 246 158 262 166 248 C172 236 168 214 172 198 Z" fill="#16161c"/>
  <path d="M353 210 C362 246 354 262 346 248 C340 236 344 214 340 198 Z" fill="#16161c"/>

